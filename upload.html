<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка расписания</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📤 Загрузка расписания</h1>
            <p>Загрузите Excel-файл (<code>.xlsx</code> или <code>.xls</code>)</p>
        </header>

        <div style="padding: 20px; background: #f8f9fc; border-radius: 12px; margin: 20px 0;">
            <input type="file" id="fileInput" accept=".xlsx,.xls" style="width: 100%; padding: 12px; border: 2px dashed #d0d7de; border-radius: 8px;">
            <button onclick="uploadFile()" style="margin-top: 14px; padding: 12px 40px; background: #4a6cf7; color: white; border: none; border-radius: 30px; font-size: 16px; cursor: pointer;">
                📤 Загрузить
            </button>
        </div>

        <div id="status"></div>

        <footer>
            <a href="index.html">← Назад к расписанию</a>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="upload.js"></script>
</body>
</html>
