<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель И-24-1</title>
    <style>
        /* ===== ЗАЩИТА ОТ ИНСПЕКТОРА ===== */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* ===== СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f7;
            padding: 20px;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 18px;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h1 {
            font-size: 26px;
            color: #1a1a2e;
        }
        .admin-header .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }
        .admin-header .badge {
            background: #4a6cf7;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
        }
        .admin-header .badge.green {
            background: #2da44e;
        }
        .admin-header .badge.red {
            background: #cf222e;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 20px;
            background: #f8f9fc;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .form-group label .required {
            color: #cf222e;
        }
        .form-group input,
        .form-group select {
            padding: 9px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            transition: border 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4a6cf7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #4a6cf7;
            color: white;
        }
        .btn-primary:hover {
            background: #3a56d4;
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
        }
        .btn-success {
            background: #2da44e;
            color: white;
        }
        .btn-success:hover {
            background: #22863a;
        }
        .btn-danger {
            background: #cf222e;
            color: white;
        }
        .btn-danger:hover {
            background: #a0111f;
        }
        .btn-secondary {
            background: #e9ecf0;
            color: #1a1a2e;
        }
        .btn-secondary:hover {
            background: #d0d7de;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 3px 10px;
            font-size: 11px;
        }

        .quick-templates {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding: 12px 16px;
            background: #f8f9fc;
            border-radius: 10px;
        }
        .quick-templates .label {
            font-size: 13px;
            font-weight: 600;
            color: #4f5b69;
            margin-right: 8px;
            display: flex;
            align-items: center;
        }
        .quick-templates .btn {
            font-size: 12px;
            padding: 5px 14px;
        }

        .pairs-list {
            margin-top: 16px;
        }
        .pair-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #f8f9fc;
            border-radius: 8px;
            margin-bottom: 6px;
            border-left: 4px solid #4a6cf7;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .pair-item .pair-info {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            flex: 1;
            align-items: center;
        }
        .pair-item .pair-info .pair-number {
            font-weight: 700;
            color: #4a6cf7;
            min-width: 70px;
        }
        .pair-item .pair-info .pair-subject {
            font-weight: 500;
            color: #1a1a2e;
        }
        .pair-item .pair-info .pair-tag {
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 30px;
            background: #e9ecf0;
            color: #4f5b69;
        }
        .pair-item .pair-info .pair-tag.subgroup {
            background: #ddf4ff;
            color: #0550ae;
        }
        .pair-item .pair-info .pair-tag.room {
            background: #eef3ff;
            color: #4a6cf7;
        }
        .pair-item .pair-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .empty-state {
            text-align: center;
            color: #8b949e;
            padding: 30px 0;
        }

        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .day-tab {
            padding: 6px 16px;
            border: 1px solid #d0d7de;
            border-radius: 30px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .day-tab.active {
            background: #4a6cf7;
            color: white;
            border-color: #4a6cf7;
        }
        .day-tab:hover:not(.active) {
            background: #f0f2f5;
        }
        .pair-count {
            font-size: 12px;
            color: #666;
            background: #e9ecf0;
            padding: 0 8px;
            border-radius: 20px;
        }
        .day-tab.active .pair-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 0;
            font-size: 14px;
            color: #4f5b69;
        }
        .stats-bar span {
            background: #f0f2f5;
            padding: 4px 14px;
            border-radius: 30px;
        }
        .stats-bar strong {
            color: #1a1a2e;
        }

        .notification-toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
            max-width: 90%;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .admin-container {
                padding: 16px;
            }
            .pair-item {
                flex-direction: column;
                align-items: stretch;
            }
            .pair-item .pair-actions {
                justify-content: flex-end;
            }
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .quick-templates .label {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container" id="adminContainer">
        <!-- ===== ШАПКА ===== -->
        <div class="admin-header">
            <div>
                <h1>⚙️ Админ-панель</h1>
                <div class="subtitle">Группа <strong>И-24-1</strong> · 3 курс · 1 семестр</div>
            </div>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <span class="badge">🔒 Защищено</span>
                <span class="badge green">📅 7 дисциплин</span>
                <button class="btn btn-secondary btn-sm" onclick="logout()">🚪 Выйти</button>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats-bar" id="statsBar">
            <span>📚 Всего пар: <strong id="totalPairs">0</strong></span>
            <span>📅 Дней: <strong id="totalDays">0</strong></span>
        </div>

        <!-- ===== ТЕКУЩЕЕ РАСПИСАНИЕ ===== -->
        <div style="margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px;">
                <h3 style="color: #1a1a2e; margin: 0;">📋 Текущее расписание</h3>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="btn btn-success btn-sm" onclick="downloadSchedule()">💾 Скачать JSON</button>
                    <button class="btn btn-secondary btn-sm" onclick="loadScheduleData()">🔄 Обновить</button>
                </div>
            </div>
            <div class="day-tabs" id="dayTabs"></div>
            <div id="pairsList">
                <div class="empty-state">⏳ Загрузка...</div>
            </div>
        </div>

        <!-- ===== ДОБАВЛЕНИЕ ПАРЫ ===== -->
        <div style="background: #f0f4ff; padding: 20px 24px; border-radius: 12px; border: 2px dashed #4a6cf7;">
            <h3 style="color: #1a1a2e; margin-bottom: 16px;">➕ Добавить пару</h3>

            <!-- Быстрые шаблоны -->
            <div class="quick-templates">
                <span class="label">⚡ Быстрый выбор:</span>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Технология разработки программного обеспечения')">💻 ТРПО</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Инструментальные средства разработки программного обеспечения')">🛠️ ИСРПО</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Математическое моделирование')">📐 Мат. моделирование</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Основы финансовой грамотности')">💰 Фин. грамотность</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Иностранный язык в профессиональной деятельности')">🌍 Иностранный</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Разработка мобильных приложений')">📱 Моб. приложения</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Физическая культура')">🏃 Физкультура</button>
            </div>

            <form id="addPairForm" class="form-grid" onsubmit="addPair(event)">
                <div class="form-group">
                    <label for="pairDate">📅 Дата <span class="required">*</span></label>
                    <input type="date" id="pairDate" required>
                </div>
                <div class="form-group">
                    <label for="pairNumber">🔢 Номер пары <span class="required">*</span></label>
                    <select id="pairNumber" required>
                        <option value="1">1 пара (08:00-09:30)</option>
                        <option value="2" selected>2 пара (09:50-11:20)</option>
                        <option value="3">3 пара (11:50-13:20)</option>
                        <option value="4">4 пара (13:30-15:00)</option>
                        <option value="5">5 пара (15:10-16:40)</option>
                        <option value="6">6 пара (16:50-18:20)</option>
                        <option value="7">7 пара (18:30-20:00)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairSubject">📚 Дисциплина <span class="required">*</span></label>
                    <select id="pairSubject" required onchange="updateFields()">
                        <option value="">— Выберите дисциплину —</option>
                        <option value="Технология разработки программного обеспечения">Технология разработки ПО</option>
                        <option value="Инструментальные средства разработки программного обеспечения">Инструментальные средства разработки ПО</option>
                        <option value="Математическое моделирование">Математическое моделирование</option>
                        <option value="Основы финансовой грамотности">Основы финансовой грамотности</option>
                        <option value="Физическая культура">Физическая культура</option>
                        <option value="Иностранный язык в профессиональной деятельности">Иностранный язык в профессиональной деятельности</option>
                        <option value="Разработка мобильных приложений">Разработка мобильных приложений</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairSubgroup">👥 Подгруппа</label>
                    <select id="pairSubgroup">
                        <option value="">—</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairTeacher">👨‍🏫 Преподаватель</label>
                    <select id="pairTeacher">
                        <option value="">— Выберите —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairRoom">📍 Аудитория</label>
                    <select id="pairRoom">
                        <option value="">— Выберите —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairBuilding">🏢 Корпус</label>
                    <select id="pairBuilding">
                        <option value="">—</option>
                        <option value="Корпус 1">Корпус 1</option>
                        <option value="Корпус 2">Корпус 2</option>
                        <option value="Корпус 3">Корпус 3</option>
                    </select>
                </div>
                <div class="form-group full-width" style="display: flex; gap: 10px; flex-wrap: wrap; padding-top: 6px;">
                    <button type="submit" class="btn btn-primary">➕ Добавить пару</button>
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">🧹 Очистить</button>
                </div>
            </form>
        </div>

        <div style="margin-top: 24px; padding-top: 18px; border-top: 1px solid #e9ecf0; display: flex; gap: 12px; flex-wrap: wrap;">
            <a href="index.html" class="btn btn-secondary">← На главную</a>
            <button class="btn btn-danger" onclick="clearAllSchedule()">🗑️ Очистить всё</button>
        </div>
    </div>

    <script>
        // =============================================
        // ===== МАКСИМАЛЬНАЯ ЗАЩИТА АДМИНКИ =====
        // =============================================

        // ===== 1. ПРОВЕРКА СЕССИИ =====
        (function checkAccess() {
            const token = sessionStorage.getItem('admin_token');
            const password = "12313456"; // Должен совпадать с login.html
            const expected = btoa(password + '_secure');
            
            if (token !== expected) {
                // Нет доступа — кидаем на логин
                window.location.replace('login.html');
                return;
            }
        })();

        // ===== 2. ЗАЩИТА ОТ ИНСПЕКТОРА =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || 
                e.key === 's' || e.key === 'S' ||
                (e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')))) {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });

        // ===== 3. ОБРАБОТКА ОШИБОК (не показываем детали) =====
        window.onerror = function() {
            return true;
        };

        // ===== 4. ВЫХОД =====
        function logout() {
            sessionStorage.removeItem('admin_token');
            window.location.replace('login.html');
        }

        // =============================================
        // ===== ОСТАЛЬНАЯ ЛОГИКА АДМИНКИ =====
        // =============================================

        const SUBJECT_DB = {
            "Технология разработки программного обеспечения": { teachers: [], rooms: [], hasSubgroups: false },
            "Инструментальные средства разработки программного обеспечения": { teachers: [], rooms: [], hasSubgroups: false },
            "Математическое моделирование": { teachers: [], rooms: [], hasSubgroups: false },
            "Основы финансовой грамотности": { teachers: [], rooms: [], hasSubgroups: false },
            "Физическая культура": { teachers: [], rooms: ["Спорт.зал"], hasSubgroups: false },
            "Иностранный язык в профессиональной деятельности": { teachers: [], rooms: [], hasSubgroups: true },
            "Разработка мобильных приложений": { teachers: [], rooms: [], hasSubgroups: false }
        };

        let scheduleData = {};
        let currentDate = '';
        let editingIndex = -1;
        let editingDate = '';

        const PAIR_TIMES = {
            1: "08:00-09:30",
            2: "09:50-11:20",
            3: "11:50-13:20",
            4: "13:30-15:00",
            5: "15:10-16:40",
            6: "16:50-18:20",
            7: "18:30-20:00"
        };
        const weekdays = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

        function updateFields() {
            const subject = document.getElementById('pairSubject').value;
            const teacherSelect = document.getElementById('pairTeacher');
            const roomSelect = document.getElementById('pairRoom');
            const subgroupSelect = document.getElementById('pairSubgroup');

            teacherSelect.innerHTML = '<option value="">— Выберите —</option>';
            roomSelect.innerHTML = '<option value="">— Выберите —</option>';

            if (subject && SUBJECT_DB[subject]) {
                const data = SUBJECT_DB[subject];
                if (data.teachers && data.teachers.length > 0) {
                    data.teachers.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t;
                        opt.textContent = t;
                        teacherSelect.appendChild(opt);
                    });
                }
                if (data.rooms && data.rooms.length > 0) {
                    data.rooms.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r;
                        opt.textContent = r;
                        roomSelect.appendChild(opt);
                    });
                }
                if (data.hasSubgroups) {
                    subgroupSelect.innerHTML = '<option value="">—</option><option value="1">1</option><option value="2">2</option>';
                } else {
                    subgroupSelect.innerHTML = '<option value="">—</option>';
                }
            }
        }

        function fillTemplate(subject) {
            document.getElementById('pairSubject').value = subject;
            updateFields();
            const roomSelect = document.getElementById('pairRoom');
            if (roomSelect.options.length > 1) roomSelect.selectedIndex = 1;
            showNotification('📌 Шаблон "' + subject + '" загружен');
        }

        async function loadScheduleData() {
            try {
                const response = await fetch('schedule.json?t=' + Date.now());
                if (!response.ok) throw new Error('Файл не найден');
                const data = await response.json();
                scheduleData = {};
                for (const [date, pairs] of Object.entries(data)) {
                    if (Array.isArray(pairs) && pairs.length > 0) {
                        scheduleData[date] = pairs;
                    }
                }
                const dates = Object.keys(scheduleData).sort();
                if (dates.length > 0 && !currentDate) currentDate = dates[0];
                updateUI();
            } catch (e) {
                scheduleData = {};
                document.getElementById('pairsList').innerHTML = `<div class="empty-state">📭 Нет загруженного расписания</div>`;
                document.getElementById('dayTabs').innerHTML = '';
                updateStats();
            }
        }

        function updateUI() {
            const dates = Object.keys(scheduleData).sort();
            updateStats();
            if (dates.length === 0) {
                document.getElementById('pairsList').innerHTML = `<div class="empty-state">📭 Нет пар. Добавьте первую пару!</div>`;
                document.getElementById('dayTabs').innerHTML = '';
                return;
            }
            let tabsHtml = '';
            dates.forEach(date => {
                const count = scheduleData[date].length;
                const isActive = date === currentDate || (currentDate === '' && date === dates[0]);
                tabsHtml += `<button class="day-tab ${isActive ? 'active' : ''}" onclick="selectDate('${date}')">${date} <span class="pair-count">${count}</span></button>`;
            });
            document.getElementById('dayTabs').innerHTML = tabsHtml;
            if (!currentDate || !scheduleData[currentDate]) currentDate = dates[0];
            renderPairs(currentDate);
        }

        function updateStats() {
            const dates = Object.keys(scheduleData);
            let total = 0;
            dates.forEach(d => total += scheduleData[d].length);
            document.getElementById('totalPairs').textContent = total;
            document.getElementById('totalDays').textContent = dates.length;
        }

        function renderPairs(date) {
            const pairs = scheduleData[date] || [];
            const container = document.getElementById('pairsList');
            if (pairs.length === 0) {
                container.innerHTML = `<div class="empty-state">📭 Нет пар на ${date}</div>`;
                return;
            }
            pairs.sort((a, b) => a.pair - b.pair);
            let html = `<div style="margin-bottom: 8px; color: #666; font-size: 14px;">📅 ${date}, ${getWeekday(date)} — ${pairs.length} пар</div>`;
            pairs.forEach((pair, index) => {
                const time = PAIR_TIMES[pair.pair] || `${pair.pair} пара`;
                const subgroup = pair.subgroup ? `<span class="pair-tag subgroup">подгр. ${pair.subgroup}</span>` : '';
                const room = pair.room ? `<span class="pair-tag room">📍 ${pair.room}</span>` : '';
                const building = pair.building ? `<span class="pair-tag">🏢 ${pair.building}</span>` : '';
                const teacher = pair.teacher ? `👨‍🏫 ${pair.teacher}` : '';
                html += `
                    <div class="pair-item">
                        <div class="pair-info">
                            <span class="pair-number">🕒 ${time}</span>
                            <span class="pair-subject">${pair.subject}</span>
                            ${subgroup} ${room} ${building}
                            <span style="color: #4f5b69; font-size: 13px;">${teacher}</span>
                        </div>
                        <div class="pair-actions">
                            <button class="btn btn-secondary btn-xs" onclick="editPair('${date}', ${index})">✏️</button>
                            <button class="btn btn-danger btn-xs" onclick="deletePair('${date}', ${index})">✕</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function getWeekday(dateStr) {
            const parts = dateStr.split('.');
            const d = new Date(parts[2], parts[1] - 1, parts[0]);
            return weekdays[d.getDay()];
        }

        function selectDate(date) {
            currentDate = date;
            updateUI();
        }

        function addPair(event) {
            event.preventDefault();
            const dateInput = document.getElementById('pairDate');
            const pairNum = parseInt(document.getElementById('pairNumber').value);
            const subgroup = document.getElementById('pairSubgroup').value;
            const subject = document.getElementById('pairSubject').value.trim();
            const teacher = document.getElementById('pairTeacher').value.trim();
            const room = document.getElementById('pairRoom').value.trim();
            const building = document.getElementById('pairBuilding').value;

            if (!dateInput.value || !subject) {
                alert('Заполните все обязательные поля!');
                return;
            }

            const parts = dateInput.value.split('-');
            const dateStr = `${parts[2]}.${parts[1]}.${parts[0]}`;
            const pair = { pair: pairNum, subject: subject, teacher: teacher || '', room: room || '', building: building || '' };
            if (subgroup) pair.subgroup = subgroup;

            if (!scheduleData[dateStr]) scheduleData[dateStr] = [];
            scheduleData[dateStr].push(pair);
            currentDate = dateStr;
            updateUI();
            clearForm();
            showNotification('✅ Пара добавлена!');
        }

        function editPair(date, index) {
            const pair = scheduleData[date][index];
            if (!pair) return;
            editingDate = date;
            editingIndex = index;
            const parts = date.split('.');
            document.getElementById('pairDate').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            document.getElementById('pairNumber').value = pair.pair;
            document.getElementById('pairSubject').value = pair.subject;
            updateFields();
            document.getElementById('pairSubgroup').value = pair.subgroup || '';
            document.getElementById('pairTeacher').value = pair.teacher || '';
            document.getElementById('pairRoom').value = pair.room || '';
            document.getElementById('pairBuilding').value = pair.building || '';

            const btn = document.querySelector('#addPairForm button[type="submit"]');
            btn.textContent = '✏️ Сохранить изменения';
            btn.style.background = '#2da44e';
            document.getElementById('addPairForm').onsubmit = function(e) { e.preventDefault();
                saveEdit(); };
            showNotification('✏️ Редактирование пары');
        }

        function saveEdit() {
            const dateInput = document.getElementById('pairDate');
            const pairNum = parseInt(document.getElementById('pairNumber').value);
            const subgroup = document.getElementById('pairSubgroup').value;
            const subject = document.getElementById('pairSubject').value.trim();
            const teacher = document.getElementById('pairTeacher').value.trim();
            const room = document.getElementById('pairRoom').value.trim();
            const building = document.getElementById('pairBuilding').value;

            if (!subject) { alert('Выберите дисциплину!'); return; }
            const parts = dateInput.value.split('-');
            const dateStr = `${parts[2]}.${parts[1]}.${parts[0]}`;
            const pair = { pair: pairNum, subject: subject, teacher: teacher || '', room: room || '', building: building || '' };
            if (subgroup) pair.subgroup = subgroup;

            if (dateStr !== editingDate) {
                scheduleData[editingDate].splice(editingIndex, 1);
                if (scheduleData[editingDate].length === 0) delete scheduleData[editingDate];
                if (!scheduleData[dateStr]) scheduleData[dateStr] = [];
                scheduleData[dateStr].push(pair);
            } else {
                scheduleData[editingDate][editingIndex] = pair;
            }
            currentDate = dateStr;
            cancelEdit();
            updateUI();
            showNotification('✅ Изменения сохранены!');
        }

        function cancelEdit() {
            editingIndex = -1;
            editingDate = '';
            document.getElementById('addPairForm').onsubmit = addPair;
            const btn = document.querySelector('#addPairForm button[type="submit"]');
            btn.textContent = '➕ Добавить пару';
            btn.style.background = '';
            clearForm();
        }

        function deletePair(date, index) {
            const pair = scheduleData[date][index];
            if (!confirm(`Удалить пару "${pair.subject}"?`)) return;
            scheduleData[date].splice(index, 1);
            if (scheduleData[date].length === 0) delete scheduleData[date];
            updateUI();
            showNotification('🗑️ Пара удалена');
        }

        function clearAllSchedule() {
            if (!confirm('⚠️ Удалить ВСЁ расписание? Это действие нельзя отменить!')) return;
            if (!confirm('Вы уверены?')) return;
            scheduleData = {};
            currentDate = '';
            updateUI();
            showNotification('🗑️ Всё расписание очищено');
        }

        function downloadSchedule() {
            if (Object.keys(scheduleData).length === 0) { alert('Расписание пустое!'); return; }
            const blob = new Blob([JSON.stringify(scheduleData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'schedule.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showNotification('💾 Файл schedule.json скачан!');
        }

        function clearForm() {
            document.getElementById('pairSubgroup').value = '';
            document.getElementById('pairSubject').value = '';
            document.getElementById('pairTeacher').value = '';
            document.getElementById('pairRoom').value = '';
            document.getElementById('pairBuilding').value = '';
            if (editingIndex >= 0) cancelEdit();
        }

        function showNotification(text) {
            const old = document.querySelector('.notification-toast');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = 'notification-toast';
            div.textContent = text;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.5s';
                setTimeout(() => div.remove(), 500);
            }, 2500);
        }

        function setDefaultDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('pairDate').value = `${year}-${month}-${day}`;
        }

        setDefaultDate();
        loadScheduleData();
    </script>
</body>
</html>
