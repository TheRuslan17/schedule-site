<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель И-24-1</title>
    <style>
        /* ===== ЗАЩИТА ===== */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4a6cf7;
            --primary-dark: #3a56d4;
            --bg: #f0f4f9;
            --white: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #4f5b69;
            --border: #d0d7de;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --warning: #f59f00;
            --warning-bg: #fff3cd;
            --danger: #cf222e;
            --success: #2da44e;
        }

        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            padding: 16px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 960px;
            margin: 0 auto;
            background: var(--white);
            border-radius: var(--radius);
            padding: 28px 32px;
            box-shadow: var(--shadow);
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 18px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: var(--text);
        }

        .header .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            background: var(--primary);
            color: white;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge.green {
            background: var(--success);
        }
        .badge.warning {
            background: var(--warning);
            color: #1a1a2e;
        }

        /* ===== КНОПКИ ===== */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            background: #22863a;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background: #a0111f;
        }

        .btn-warning {
            background: var(--warning);
            color: #1a1a2e;
        }
        .btn-warning:hover {
            background: #e67700;
        }

        .btn-secondary {
            background: #e9ecf0;
            color: var(--text);
        }
        .btn-secondary:hover {
            background: #d0d7de;
        }

        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 3px 10px;
            font-size: 11px;
        }

        /* ===== ФОРМА ===== */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 16px;
            background: #f8f9fc;
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .form-group label .required {
            color: var(--danger);
        }

        .form-group input,
        .form-group select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: white;
            transition: border 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }

        .form-group .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 6px;
        }

        .form-group .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--warning);
        }

        .form-group .checkbox-group label {
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
        }

        .form-group .checkbox-group .warning-text {
            color: var(--warning);
            font-weight: 600;
        }

        .quick-templates {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: #f8f9fc;
            border-radius: 8px;
        }

        .quick-templates .label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            margin-right: 6px;
        }

        .quick-templates .btn {
            font-size: 11px;
            padding: 4px 12px;
        }

        /* ===== СПИСОК ПАР ===== */
        .pairs-list {
            margin-top: 12px;
        }

        .pair-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: #f8f9fc;
            border-radius: 8px;
            margin-bottom: 4px;
            border-left: 4px solid var(--primary);
            flex-wrap: wrap;
            gap: 4px 10px;
            transition: 0.2s;
        }

        .pair-item.changed {
            border-left-color: var(--warning);
            background: var(--warning-bg);
        }

        .pair-item .pair-info {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            flex: 1;
            align-items: center;
            font-size: 14px;
        }

        .pair-item .pair-info .num {
            font-weight: 700;
            color: var(--primary);
            min-width: 60px;
        }

        .pair-item.changed .pair-info .num {
            color: var(--warning);
        }

        .pair-item .pair-info .subject {
            font-weight: 500;
        }

        .pair-item .pair-info .tag {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 30px;
            background: #e9ecf0;
            color: var(--text-secondary);
        }

        .pair-item .pair-info .tag.subgroup {
            background: #ddf4ff;
            color: #0550ae;
        }

        .pair-item .pair-info .tag.room {
            background: #eef3ff;
            color: var(--primary);
        }

        .pair-item .pair-info .tag.changed-tag {
            background: var(--warning);
            color: #1a1a2e;
            font-weight: 600;
        }

        .pair-item .pair-actions {
            display: flex;
            gap: 4px;
        }

        .empty-state {
            text-align: center;
            color: #8b949e;
            padding: 24px 0;
        }

        /* ===== ВКЛАДКИ ===== */
        .day-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .day-tab {
            padding: 5px 14px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: white;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
            position: relative;
        }

        .day-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .day-tab.has-changes {
            border-color: var(--warning);
        }

        .day-tab.has-changes.active {
            background: var(--warning);
            border-color: var(--warning);
        }

        .day-tab .change-dot {
            display: none;
            width: 8px;
            height: 8px;
            background: var(--warning);
            border-radius: 50%;
            position: absolute;
            top: -3px;
            right: -3px;
        }

        .day-tab.has-changes .change-dot {
            display: block;
        }

        .day-tab:hover:not(.active) {
            background: #f0f2f5;
        }

        .pair-count {
            font-size: 11px;
            color: #666;
            background: #e9ecf0;
            padding: 0 6px;
            border-radius: 20px;
        }

        .day-tab.active .pair-count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* ===== СТАТИСТИКА ===== */
        .stats {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 6px 0 12px 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stats span {
            background: #f0f2f5;
            padding: 2px 12px;
            border-radius: 30px;
        }

        .stats strong {
            color: var(--text);
        }

        .stats .changed-count {
            background: var(--warning-bg);
            color: #856404;
        }

        /* ===== УВЕДОМЛЕНИЯ ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a1a2e;
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            z-index: 9999;
            animation: fadeIn 0.3s ease;
            max-width: 90%;
        }

        .toast.warning {
            background: var(--warning);
            color: #1a1a2e;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer-actions {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e9ecf0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ ===== */
        .info-panel {
            background: #f8f9fc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 14px;
        }

        .info-panel .changes-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-panel .changes-info .icon {
            font-size: 18px;
        }

        .info-panel .changes-info .text {
            color: var(--text-secondary);
        }

        .info-panel .changes-info .text strong {
            color: var(--warning);
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .admin-container {
                padding: 18px 16px;
            }
            .form-grid {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-actions {
                width: 100%;
                justify-content: flex-start;
            }
            .pair-item {
                flex-direction: column;
                align-items: stretch;
            }
            .pair-item .pair-actions {
                justify-content: flex-end;
            }
            .quick-templates .label {
                width: 100%;
            }
            .info-panel {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .admin-container {
                padding: 12px 10px;
            }
            .header h1 {
                font-size: 18px;
            }
            .form-grid {
                padding: 12px;
                gap: 10px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            .pair-item .pair-info {
                font-size: 13px;
            }
            .stats {
                font-size: 12px;
                gap: 8px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --white: #161b22;
                --text: #f0f6fc;
                --text-secondary: #8b949e;
                --border: #30363d;
                --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
                --warning-bg: #1c1a0d;
            }
            .header {
                border-bottom-color: #21262d;
            }
            .form-grid {
                background: #0d1117;
            }
            .form-group input,
            .form-group select {
                background: #0d1117;
                color: #f0f6fc;
                border-color: #30363d;
            }
            .pair-item {
                background: #0d1117;
            }
            .pair-item.changed {
                background: #1c1a0d;
            }
            .pair-item .pair-info .tag {
                background: #21262d;
                color: #8b949e;
            }
            .pair-item .pair-info .tag.subgroup {
                background: #1c2333;
                color: #58a6ff;
            }
            .pair-item .pair-info .tag.room {
                background: #1c2333;
                color: #58a6ff;
            }
            .pair-item .pair-info .tag.changed-tag {
                background: var(--warning);
                color: #1a1a2e;
            }
            .day-tab {
                background: #0d1117;
                border-color: #30363d;
                color: #f0f6fc;
            }
            .day-tab.active {
                background: var(--primary);
                color: white;
            }
            .day-tab.has-changes.active {
                background: var(--warning);
            }
            .day-tab:hover:not(.active) {
                background: #21262d;
            }
            .stats span {
                background: #21262d;
            }
            .stats .changed-count {
                background: #1c1a0d;
                color: #fcc419;
            }
            .quick-templates {
                background: #0d1117;
            }
            .btn-secondary {
                background: #21262d;
                color: #f0f6fc;
            }
            .btn-secondary:hover {
                background: #30363d;
            }
            .footer-actions {
                border-top-color: #21262d;
            }
            .pair-count {
                background: #21262d;
                color: #8b949e;
            }
            .day-tab.active .pair-count {
                background: rgba(255, 255, 255, 0.15);
                color: white;
            }
            .info-panel {
                background: #0d1117;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <div>
                <h1>⚙️ Админ-панель</h1>
                <div class="subtitle">Группа <strong>И-24-1</strong> · 3 курс · 1 семестр</div>
            </div>
            <div class="header-actions">
                <span class="badge">🔒 Защищено</span>
                <span class="badge green">📅 7 дисциплин</span>
                <button class="btn btn-secondary btn-sm" onclick="logout()">🚪 Выйти</button>
            </div>
        </div>

        <!-- ===== СТАТИСТИКА ===== -->
        <div class="stats" id="statsBar">
            <span>📚 Всего пар: <strong id="totalPairs">0</strong></span>
            <span>📅 Дней: <strong id="totalDays">0</strong></span>
            <span class="changed-count" id="changedCount">🔄 Изменений: <strong id="totalChanges">0</strong></span>
        </div>

        <!-- ===== ТЕКУЩЕЕ РАСПИСАНИЕ ===== -->
        <div style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px;">
                <h3 style="color: var(--text); font-size: 17px;">📋 Текущее расписание</h3>
                <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button class="btn btn-success btn-sm" onclick="downloadSchedule()">💾 Скачать</button>
                    <button class="btn btn-secondary btn-sm" onclick="loadScheduleData()">🔄 Обновить</button>
                </div>
            </div>
            <div class="day-tabs" id="dayTabs"></div>
            <div id="pairsList">
                <div class="empty-state">⏳ Загрузка...</div>
            </div>
        </div>

        <!-- ===== ДОБАВЛЕНИЕ ===== -->
        <div style="background: #f0f4ff; padding: 16px 20px; border-radius: 12px; border: 2px dashed var(--primary);">
            <h3 style="color: var(--text); font-size: 17px; margin-bottom: 12px;">➕ Добавить пару</h3>

            <div class="quick-templates">
                <span class="label">⚡ Быстрый выбор:</span>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Технология разработки программного обеспечения')">💻 ТРПО</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Инструментальные средства разработки программного обеспечения')">🛠️ ИСРПО</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Математическое моделирование')">📐 Моделирование</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Основы финансовой грамотности')">💰 Финансы</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Иностранный язык в профессиональной деятельности')">🌍 Иностранный</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Разработка мобильных приложений')">📱 Моб. приложения</button>
                <button class="btn btn-secondary btn-sm" onclick="fillTemplate('Физическая культура')">🏃 Физкультура</button>
            </div>

            <form id="addPairForm" class="form-grid" onsubmit="addPair(event)">
                <div class="form-group">
                    <label for="pairDate">📅 Дата <span class="required">*</span></label>
                    <input type="date" id="pairDate" required>
                </div>
                <div class="form-group">
                    <label for="pairNumber">🔢 Номер <span class="required">*</span></label>
                    <select id="pairNumber" required>
                        <option value="1">1 (08:00-09:30)</option>
                        <option value="2" selected>2 (09:50-11:20)</option>
                        <option value="3">3 (11:50-13:20)</option>
                        <option value="4">4 (13:30-15:00)</option>
                        <option value="5">5 (15:10-16:40)</option>
                        <option value="6">6 (16:50-18:20)</option>
                        <option value="7">7 (18:30-20:00)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairSubject">📚 Дисциплина <span class="required">*</span></label>
                    <select id="pairSubject" required onchange="updateFields()">
                        <option value="">— Выберите —</option>
                        <option value="Технология разработки программного обеспечения">Технология разработки ПО</option>
                        <option value="Инструментальные средства разработки программного обеспечения">Инструментальные средства разработки ПО</option>
                        <option value="Математическое моделирование">Математическое моделирование</option>
                        <option value="Основы финансовой грамотности">Основы финансовой грамотности</option>
                        <option value="Физическая культура">Физическая культура</option>
                        <option value="Иностранный язык в профессиональной деятельности">Иностранный язык в профессиональной деятельности</option>
                        <option value="Разработка мобильных приложений">Разработка мобильных приложений</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairSubgroup">👥 Подгруппа</label>
                    <select id="pairSubgroup">
                        <option value="">—</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pairTeacher">👨‍🏫 Преподаватель</label>
                    <select id="pairTeacher"><option value="">—</option></select>
                </div>
                <div class="form-group">
                    <label for="pairRoom">📍 Аудитория</label>
                    <select id="pairRoom"><option value="">—</option></select>
                </div>
                <div class="form-group">
                    <label for="pairBuilding">🏢 Корпус</label>
                    <select id="pairBuilding">
                        <option value="">—</option>
                        <option value="Корпус 1">Корпус 1</option>
                        <option value="Корпус 2">Корпус 2</option>
                    </select>
                </div>

                <!-- ===== НОВЫЙ ПУНКТ: ИЗМЕНЕНИЕ ===== -->
                <div class="form-group full-width" style="border-top: 1px solid #e9ecf0; padding-top: 12px; margin-top: 4px;">
                    <div class="checkbox-group">
                        <input type="checkbox" id="isChanged">
                        <label for="isChanged">
                            <span class="warning-text">🔄 ИЗМЕНЕНИЕ</span>
                            <span style="color: var(--text-secondary); font-weight: 400;">
                                — отметить, что эта пара была изменена
                            </span>
                        </label>
                    </div>
                </div>

                <div class="form-group full-width" style="display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px;">
                    <button type="submit" class="btn btn-primary">➕ Добавить</button>
                    <button type="button" class="btn btn-secondary" onclick="clearForm()">🧹 Очистить</button>
                </div>
            </form>
        </div>

        <div class="footer-actions">
            <a href="index.html" class="btn btn-secondary">← На главную</a>
            <button class="btn btn-warning" onclick="clearAllChanges()">🔄 Сбросить все ИЗМЕНЕНИЯ</button>
            <button class="btn btn-danger" onclick="clearAllSchedule()">🗑️ Очистить всё</button>
        </div>
    </div>

    <script>
        // ============================================
        // ЗАЩИТА
        // ============================================
        (function checkAccess() {
            const token = sessionStorage.getItem('admin_token');
            const password = "12313456";
            const expected = btoa(password + '_secure');
            if (token !== expected) {
                window.location.replace('login.html');
                return;
            }
        })();

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' ||
                    e.key === 's' || e.key === 'S' ||
                    (e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')))) {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); return false; });
        window.onerror = function() { return true; };

        function logout() {
            sessionStorage.removeItem('admin_token');
            window.location.replace('login.html');
        }

        // ============================================
        // ЛОГИКА АДМИНКИ
        // ============================================
        const SUBJECT_DB = {
            "Технология разработки программного обеспечения": { teachers: [], rooms: [], hasSubgroups: false },
            "Инструментальные средства разработки программного обеспечения": { teachers: [], rooms: [], hasSubgroups: false },
            "Математическое моделирование": { teachers: [], rooms: [], hasSubgroups: false },
            "Основы финансовой грамотности": { teachers: [], rooms: [], hasSubgroups: false },
            "Физическая культура": { teachers: [], rooms: ["Спорт.зал"], hasSubgroups: false },
            "Иностранный язык в профессиональной деятельности": { teachers: [], rooms: [], hasSubgroups: true },
            "Разработка мобильных приложений": { teachers: [], rooms: [], hasSubgroups: false }
        };

        let scheduleData = {};
        let currentDate = '';
        let editingIndex = -1;
        let editingDate = '';

        const PAIR_TIMES = {
            1: "08:00-09:30",
            2: "09:50-11:20",
            3: "11:50-13:20",
            4: "13:30-15:00",
            5: "15:10-16:40",
            6: "16:50-18:20",
            7: "18:30-20:00"
        };
        const weekdays = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

        function updateFields() {
            const subject = document.getElementById('pairSubject').value;
            const teacherSelect = document.getElementById('pairTeacher');
            const roomSelect = document.getElementById('pairRoom');
            const subgroupSelect = document.getElementById('pairSubgroup');

            teacherSelect.innerHTML = '<option value="">—</option>';
            roomSelect.innerHTML = '<option value="">—</option>';

            if (subject && SUBJECT_DB[subject]) {
                const data = SUBJECT_DB[subject];
                if (data.teachers && data.teachers.length > 0) {
                    data.teachers.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t;
                        opt.textContent = t;
                        teacherSelect.appendChild(opt);
                    });
                }
                if (data.rooms && data.rooms.length > 0) {
                    data.rooms.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r;
                        opt.textContent = r;
                        roomSelect.appendChild(opt);
                    });
                }
                if (data.hasSubgroups) {
                    subgroupSelect.innerHTML = '<option value="">—</option><option value="1">1</option><option value="2">2</option>';
                } else {
                    subgroupSelect.innerHTML = '<option value="">—</option>';
                }
            }
        }

        function fillTemplate(subject) {
            document.getElementById('pairSubject').value = subject;
            updateFields();
            const roomSelect = document.getElementById('pairRoom');
            if (roomSelect.options.length > 1) roomSelect.selectedIndex = 1;
            showToast('📌 Шаблон "' + subject + '" загружен');
        }

        async function loadScheduleData() {
            try {
                const response = await fetch('schedule.json?t=' + Date.now());
                if (!response.ok) throw new Error('Файл не найден');
                const data = await response.json();
                scheduleData = {};
                for (const [date, pairs] of Object.entries(data)) {
                    if (Array.isArray(pairs) && pairs.length > 0) {
                        scheduleData[date] = pairs;
                    }
                }
                const dates = Object.keys(scheduleData).sort();
                if (dates.length > 0 && !currentDate) currentDate = dates[0];
                updateUI();
            } catch (e) {
                scheduleData = {};
                document.getElementById('pairsList').innerHTML =
                    `<div class="empty-state">📭 Нет загруженного расписания</div>`;
                document.getElementById('dayTabs').innerHTML = '';
                updateStats();
            }
        }

        function updateUI() {
            const dates = Object.keys(scheduleData).sort();
            updateStats();

            if (dates.length === 0) {
                document.getElementById('pairsList').innerHTML =
                    `<div class="empty-state">📭 Нет пар. Добавьте первую пару!</div>`;
                document.getElementById('dayTabs').innerHTML = '';
                return;
            }

            let tabsHtml = '';
            dates.forEach(date => {
                const count = scheduleData[date].length;
                const hasChanges = scheduleData[date].some(p => p.changed === true);
                const isActive = date === currentDate || (currentDate === '' && date === dates[0]);
                tabsHtml += `
                    <button class="day-tab ${isActive ? 'active' : ''} ${hasChanges ? 'has-changes' : ''}" 
                            onclick="selectDate('${date}')">
                        ${date} <span class="pair-count">${count}</span>
                        <span class="change-dot"></span>
                    </button>
                `;
            });
            document.getElementById('dayTabs').innerHTML = tabsHtml;

            if (!currentDate || !scheduleData[currentDate]) currentDate = dates[0];
            renderPairs(currentDate);
        }

        function updateStats() {
            const dates = Object.keys(scheduleData);
            let total = 0;
            let changes = 0;
            dates.forEach(d => {
                total += scheduleData[d].length;
                changes += scheduleData[d].filter(p => p.changed === true).length;
            });
            document.getElementById('totalPairs').textContent = total;
            document.getElementById('totalDays').textContent = dates.length;
            document.getElementById('totalChanges').textContent = changes;
        }

        function renderPairs(date) {
            const pairs = scheduleData[date] || [];
            const container = document.getElementById('pairsList');

            if (pairs.length === 0) {
                container.innerHTML = `<div class="empty-state">📭 Нет пар на ${date}</div>`;
                return;
            }

            pairs.sort((a, b) => a.pair - b.pair);

            const hasChanges = pairs.some(p => p.changed === true);
            let html = `
                <div class="info-panel">
                    <div class="changes-info">
                        <span class="icon">📅</span>
                        <span class="text">${date}, ${getWeekday(date)} — ${pairs.length} пар</span>
                    </div>
                    ${hasChanges ? `
                        <div class="changes-info">
                            <span class="icon">🔄</span>
                            <span class="text"><strong>Есть изменения</strong> — нажмите ✏️ для просмотра</span>
                        </div>
                    ` : ''}
                </div>
            `;

            pairs.forEach((pair, index) => {
                const time = PAIR_TIMES[pair.pair] || `${pair.pair} пара`;
                const subgroup = pair.subgroup ? `<span class="tag subgroup">подгр. ${pair.subgroup}</span>` : '';
                const room = pair.room ? `<span class="tag room">📍 ${pair.room}</span>` : '';
                const building = pair.building ? `<span class="tag">🏢 ${pair.building}</span>` : '';
                const teacher = pair.teacher ? `👨‍🏫 ${pair.teacher}` : '';
                const changedTag = pair.changed ? `<span class="tag changed-tag">🔄 ИЗМЕНЕНИЕ</span>` : '';

                html += `
                    <div class="pair-item ${pair.changed ? 'changed' : ''}">
                        <div class="pair-info">
                            <span class="num">🕒 ${time}</span>
                            <span class="subject">${pair.subject}</span>
                            ${subgroup} ${room} ${building} ${changedTag}
                            <span style="color: var(--text-secondary); font-size: 13px;">${teacher}</span>
                        </div>
                        <div class="pair-actions">
                            <button class="btn btn-secondary btn-xs" onclick="editPair('${date}', ${index})">✏️</button>
                            <button class="btn btn-warning btn-xs" onclick="toggleChange('${date}', ${index})" title="Переключить статус ИЗМЕНЕНИЕ">🔄</button>
                            <button class="btn btn-danger btn-xs" onclick="deletePair('${date}', ${index})">✕</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function getWeekday(dateStr) {
            const parts = dateStr.split('.');
            const d = new Date(parts[2], parts[1] - 1, parts[0]);
            return weekdays[d.getDay()];
        }

        function selectDate(date) {
            currentDate = date;
            updateUI();
        }

        // ===== ДОБАВЛЕНИЕ С ПОДДЕРЖКОЙ ИЗМЕНЕНИЙ =====
        function addPair(event) {
            event.preventDefault();

            const dateInput = document.getElementById('pairDate');
            const pairNum = parseInt(document.getElementById('pairNumber').value);
            const subgroup = document.getElementById('pairSubgroup').value;
            const subject = document.getElementById('pairSubject').value.trim();
            const teacher = document.getElementById('pairTeacher').value.trim();
            const room = document.getElementById('pairRoom').value.trim();
            const building = document.getElementById('pairBuilding').value;
            const isChanged = document.getElementById('isChanged').checked;

            if (!dateInput.value || !subject) {
                alert('Заполните все обязательные поля!');
                return;
            }

            const parts = dateInput.value.split('-');
            const dateStr = `${parts[2]}.${parts[1]}.${parts[0]}`;

            const pair = {
                pair: pairNum,
                subject: subject,
                teacher: teacher || '',
                room: room || '',
                building: building || ''
            };
            if (subgroup) pair.subgroup = subgroup;
            if (isChanged) pair.changed = true;

            if (!scheduleData[dateStr]) scheduleData[dateStr] = [];
            scheduleData[dateStr].push(pair);

            currentDate = dateStr;
            updateUI();
            clearForm();

            if (isChanged) {
                showToast('🔄 Пара добавлена с пометкой ИЗМЕНЕНИЕ!', 'warning');
            } else {
                showToast('✅ Пара добавлена!');
            }
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ СТАТУСА ИЗМЕНЕНИЯ =====
        function toggleChange(date, index) {
            const pair = scheduleData[date][index];
            if (!pair) return;

            pair.changed = !pair.changed;
            updateUI();

            if (pair.changed) {
                showToast('🔄 Пара отмечена как ИЗМЕНЕНИЕ', 'warning');
            } else {
                showToast('✅ Пометка ИЗМЕНЕНИЕ снята');
            }
        }

        // ===== РЕДАКТИРОВАНИЕ С ПОДДЕРЖКОЙ ИЗМЕНЕНИЙ =====
        function editPair(date, index) {
            const pair = scheduleData[date][index];
            if (!pair) return;

            editingDate = date;
            editingIndex = index;

            const parts = date.split('.');
            document.getElementById('pairDate').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
            document.getElementById('pairNumber').value = pair.pair;
            document.getElementById('pairSubject').value = pair.subject;
            updateFields();
            document.getElementById('pairSubgroup').value = pair.subgroup || '';
            document.getElementById('pairTeacher').value = pair.teacher || '';
            document.getElementById('pairRoom').value = pair.room || '';
            document.getElementById('pairBuilding').value = pair.building || '';
            document.getElementById('isChanged').checked = pair.changed || false;

            const btn = document.querySelector('#addPairForm button[type="submit"]');
            btn.textContent = '✏️ Сохранить';
            btn.style.background = '#2da44e';

            document.getElementById('addPairForm').onsubmit = function(e) {
                e.preventDefault();
                saveEdit();
            };

            showToast('✏️ Редактирование пары');
        }

        function saveEdit() {
            const dateInput = document.getElementById('pairDate');
            const pairNum = parseInt(document.getElementById('pairNumber').value);
            const subgroup = document.getElementById('pairSubgroup').value;
            const subject = document.getElementById('pairSubject').value.trim();
            const teacher = document.getElementById('pairTeacher').value.trim();
            const room = document.getElementById('pairRoom').value.trim();
            const building = document.getElementById('pairBuilding').value;
            const isChanged = document.getElementById('isChanged').checked;

            if (!subject) { alert('Выберите дисциплину!'); return; }

            const parts = dateInput.value.split('-');
            const dateStr = `${parts[2]}.${parts[1]}.${parts[0]}`;

            const pair = {
                pair: pairNum,
                subject: subject,
                teacher: teacher || '',
                room: room || '',
                building: building || ''
            };
            if (subgroup) pair.subgroup = subgroup;
            if (isChanged) pair.changed = true;

            if (dateStr !== editingDate) {
                scheduleData[editingDate].splice(editingIndex, 1);
                if (scheduleData[editingDate].length === 0) delete scheduleData[editingDate];
                if (!scheduleData[dateStr]) scheduleData[dateStr] = [];
                scheduleData[dateStr].push(pair);
            } else {
                scheduleData[editingDate][editingIndex] = pair;
            }

            currentDate = dateStr;
            cancelEdit();
            updateUI();

            if (isChanged) {
                showToast('🔄 Изменения сохранены с пометкой ИЗМЕНЕНИЕ!', 'warning');
            } else {
                showToast('✅ Изменения сохранены!');
            }
        }

        function cancelEdit() {
            editingIndex = -1;
            editingDate = '';
            document.getElementById('addPairForm').onsubmit = addPair;
            const btn = document.querySelector('#addPairForm button[type="submit"]');
            btn.textContent = '➕ Добавить пару';
            btn.style.background = '';
            clearForm();
        }

        // ===== УДАЛЕНИЕ =====
        function deletePair(date, index) {
            const pair = scheduleData[date][index];
            if (!confirm(`Удалить пару "${pair.subject}"?`)) return;
            scheduleData[date].splice(index, 1);
            if (scheduleData[date].length === 0) delete scheduleData[date];
            updateUI();
            showToast('🗑️ Пара удалена');
        }

        // ===== СБРОС ВСЕХ ИЗМЕНЕНИЙ =====
        function clearAllChanges() {
            if (!confirm('🔄 Снять пометку ИЗМЕНЕНИЕ со всех пар?')) return;

            let count = 0;
            for (const date in scheduleData) {
                scheduleData[date].forEach(p => {
                    if (p.changed) {
                        p.changed = false;
                        count++;
                    }
                });
            }

            updateUI();
            showToast(`🔄 Снято ${count} пометок ИЗМЕНЕНИЕ`);
        }

        // ===== ОЧИСТКА ВСЕГО =====
        function clearAllSchedule() {
            if (!confirm('⚠️ Удалить ВСЁ расписание? Это действие нельзя отменить!')) return;
            if (!confirm('Вы уверены?')) return;
            scheduleData = {};
            currentDate = '';
            updateUI();
            showToast('🗑️ Всё расписание очищено');
        }

        // ===== СКАЧИВАНИЕ =====
        function downloadSchedule() {
            if (Object.keys(scheduleData).length === 0) { alert('Расписание пустое!'); return; }
            const blob = new Blob([JSON.stringify(scheduleData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'schedule.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('💾 Файл schedule.json скачан!');
        }

        // ===== ОЧИСТКА ФОРМЫ =====
        function clearForm() {
            document.getElementById('pairSubgroup').value = '';
            document.getElementById('pairSubject').value = '';
            document.getElementById('pairTeacher').value = '';
            document.getElementById('pairRoom').value = '';
            document.getElementById('pairBuilding').value = '';
            document.getElementById('isChanged').checked = false;
            if (editingIndex >= 0) cancelEdit();
        }

        // ===== УВЕДОМЛЕНИЯ =====
        function showToast(text, type = '') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            const div = document.createElement('div');
            div.className = `toast ${type}`;
            div.textContent = text;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.5s';
                setTimeout(() => div.remove(), 500);
            }, 3000);
        }

        function setDefaultDate() {
            const today = new Date();
            document.getElementById('pairDate').value = today.toISOString().split('T')[0];
        }

        setDefaultDate();
        loadScheduleData();
    </script>
</body>
</html>
