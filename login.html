<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель</title>
    <style>
        /* ===== ЗАЩИТА ОТ ИНСПЕКТОРА ===== */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* ===== СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: #161b22;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid #30363d;
        }
        .login-box .lock-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .login-box h1 {
            font-size: 22px;
            color: #f0f6fc;
            margin-bottom: 6px;
        }
        .login-box p {
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .login-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #30363d;
            border-radius: 8px;
            font-size: 16px;
            background: #0d1117;
            color: #f0f6fc;
            margin-bottom: 12px;
            transition: border 0.2s;
        }
        .login-box input:focus {
            border-color: #4a6cf7;
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.15);
        }
        .login-box .btn {
            width: 100%;
            padding: 12px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
        }
        .login-box .btn:hover {
            background: #3a56d4;
            transform: scale(0.98);
        }
        .login-box .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-box .error {
            color: #f85149;
            font-size: 14px;
            margin-top: 12px;
            display: none;
            background: #da36331a;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #f8514933;
        }
        .login-box .attempts {
            color: #8b949e;
            font-size: 12px;
            margin-top: 12px;
        }
        .login-box .hint {
            font-size: 12px;
            color: #484f58;
            margin-top: 16px;
        }
        .login-box .hint a {
            color: #4a6cf7;
            text-decoration: none;
        }
        .login-box .hint a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <div class="lock-icon">🔒</div>
        <h1>Доступ к админ-панели</h1>
        <p>Введите пароль для управления расписанием</p>
        
        <input type="password" id="passwordInput" placeholder="Введите пароль" 
               onkeydown="if(event.key==='Enter') checkPassword()" autofocus>
        <button class="btn" id="loginBtn" onclick="checkPassword()">Войти</button>
        
        <div class="error" id="errorMsg">❌ Неверный пароль</div>
        <div class="attempts" id="attemptsMsg">Осталось попыток: 3</div>
        <div class="hint">
            <a href="index.html">← На главную</a>
        </div>
    </div>

    <script>
        // =============================================
        // ===== МАКСИМАЛЬНАЯ ЗАЩИТА =====
        // =============================================

        // ===== 1. ПАРОЛЬ (ИЗМЕНИТЕ НА СВОЙ) =====
        const ADMIN_PASSWORD = "12313456";

        // ===== 2. ЗАЩИТА ОТ БРУТФОРСА =====
        let attempts = 3;
        let blocked = false;

        // ===== 3. ПРОВЕРКА СЕССИИ =====
        function checkSession() {
            const token = sessionStorage.getItem('admin_token');
            if (token === btoa(ADMIN_PASSWORD + '_secure')) {
                window.location.href = 'admin-panel.html';
                return true;
            }
            return false;
        }

        // ===== 4. ОСНОВНАЯ ФУНКЦИЯ =====
        function checkPassword() {
            const input = document.getElementById('passwordInput');
            const error = document.getElementById('errorMsg');
            const attemptsMsg = document.getElementById('attemptsMsg');
            const btn = document.getElementById('loginBtn');

            // Если заблокирован
            if (blocked) {
                error.textContent = '⛔ Доступ заблокирован на 5 минут';
                error.style.display = 'block';
                return;
            }

            // Проверка пароля
            if (input.value === ADMIN_PASSWORD) {
                // Успех!
                sessionStorage.setItem('admin_token', btoa(ADMIN_PASSWORD + '_secure'));
                // Скрытый редирект
                window.location.replace('admin-panel.html');
                return;
            }

            // Неверный пароль
            attempts--;
            attemptsMsg.textContent = `Осталось попыток: ${attempts}`;
            error.style.display = 'block';
            input.value = '';
            input.focus();

            // Блокировка после 3 ошибок
            if (attempts <= 0) {
                blocked = true;
                btn.disabled = true;
                attemptsMsg.textContent = '⛔ Доступ заблокирован на 5 минут';
                error.textContent = '⛔ Слишком много попыток. Подождите 5 минут.';
                error.style.display = 'block';

                setTimeout(() => {
                    blocked = false;
                    attempts = 3;
                    btn.disabled = false;
                    attemptsMsg.textContent = 'Осталось попыток: 3';
                    error.style.display = 'none';
                }, 300000); // 5 минут
                return;
            }

            // Скрываем ошибку через 2 секунды
            setTimeout(() => {
                error.style.display = 'none';
            }, 2000);
        }

        // ===== 5. ЗАЩИТА ОТ ИНСПЕКТОРА =====
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
            // Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+S
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || 
                e.key === 's' || e.key === 'S' ||
                (e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')))) {
                e.preventDefault();
                return false;
            }
        });

        // Контекстное меню (правая кнопка)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // Защита от выделения текста
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
        });

        // ===== 6. ЗАПУСК =====
        if (!checkSession()) {
            // Показываем форму входа
            document.getElementById('loginBox').style.display = 'block';
        }
    </script>
</body>
</html>
