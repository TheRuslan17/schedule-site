<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Расписание колледжа</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Расписание занятий</h1>
            <p id="groupInfo">Группа: <strong>И-24-1</strong></p>

            <div class="loader">⏳ Загрузка расписания...</div>
        </div>

        <footer>
            <a href="upload.html">⚙️ Загрузить новое расписание (админ)</a>
        </footer>

    <script src="script.js"></script>

</html>
