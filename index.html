<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📅 Расписание И-24-1</title>
    <meta name="description" content="Актуальное расписание занятий для группы И-24-1">
    
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Расписание И-24-1">
    <meta name="theme-color" content="#4a6cf7">
    
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="script.js" as="script">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <header class="header">
            <div class="header-content">
                <div class="header-left">
                    <span class="header-icon">📅</span>
                    <div>
                        <h1>Расписание занятий</h1>
                        <p class="subtitle">Группа <strong>И-24-1</strong> · 3 курс · 1 семестр</p>
                    </div>
                </div>
                <div class="header-right">
                    <span class="role-badge" id="roleBadge">👤 Студент</span>
                </div>
            </div>
        </header>

        <!-- ВКЛАДКИ (РАСПИСАНИЕ / ЗВОНКИ) -->
        <nav class="tabs" role="tablist">
            <button class="tab active" data-tab="schedule" onclick="switchTab('schedule')">
                📅 Расписание
            </button>
            <button class="tab" data-tab="calls" onclick="switchTab('calls')">
                🔔 Звонки
            </button>
        </nav>

        <!-- ВКЛАДКА 1: РАСПИСАНИЕ -->
        <div id="tab-schedule" class="tab-content active">
            <nav class="controls" role="navigation">
                <button class="btn btn-primary" onclick="loadToday()">📅 Сегодня</button>
                <button class="btn btn-outline" onclick="loadTomorrow()">📅 Завтра</button>
                <button class="btn btn-outline" onclick="loadWeek(0)">📋 Неделя</button>
                <div class="date-picker-wrapper">
                    <label for="datePicker" class="visually-hidden">Выберите дату</label>
                    <input type="date" id="datePicker" onchange="loadDate(this.value)">
                </div>
            </nav>

            <div class="info-bar" id="infoBar">
                <span id="currentView">📅 Сегодня</span>
                <span id="pairsCount">Всего пар: 0</span>
            </div>

            <div id="scheduleContainer" role="main" aria-live="polite">
                <div class="loader" id="loader">
                    <div class="loader-spinner"></div>
                    <p>⏳ Загрузка расписания...</p>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА 2: РАСПИСАНИЕ ЗВОНКОВ -->
        <div id="tab-calls" class="tab-content">
            <h2 class="tab-title">🔔 Расписание звонков</h2>
            <div id="callsContainer">
                <div class="loader"><div class="loader-spinner"></div><p>⏳ Загрузка...</p></div>
            </div>
        </div>

        <!-- ПОДВАЛ -->
        <footer class="footer">
            <span>© 2026 · Расписание И-24-1</span>
            <span class="footer-separator">|</span>
            <span class="update-time" id="updateTime">Обновлено: —</span>
            <a href="login.html" class="admin-link" aria-label="Админ-панель (скрытая)">⚙️</a>
        </footer>
    </div>

    <!-- КНОПКА "НАВЕРХ" -->
    <button id="backToTop" class="back-to-top" onclick="scrollToTop()" aria-label="Наверх">↑</button>

    <script src="script.js"></script>
</body>
</html>
